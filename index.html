<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITP Conecta - Sistema Escolar Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .table-scroll { max-height: 480px; overflow-y: auto; }
        .table-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-scroll::-webkit-scrollbar-track { background: #f8fafc; }
        .table-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .table-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden text-slate-800">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="w-full flex items-center justify-center bg-slate-900 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 border border-slate-100">
            <div class="flex justify-center mb-3">
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-2xl">
                    <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-center text-slate-900 mb-1">ITP Conecta</h1>
            <p class="text-center text-slate-500 text-sm mb-6">Sistema de Control Escolar</p>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-600">Correo Electrónico</label>
                    <input type="email" id="login-email" class="w-full mt-1.5 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" placeholder="admin@escuela.com">
                </div>
                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-600">Contraseña</label>
                    <input type="password" id="login-password" class="w-full mt-1.5 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" placeholder="••••••••">
                </div>
                <button onclick="login()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold hover:bg-indigo-700 shadow-sm transition">Iniciar Sesión</button>
            </div>
            <div class="mt-5 text-center border-t border-slate-100 pt-4">
                <button onclick="toggleModal('registro-modal')" class="text-sm font-medium text-indigo-600 hover:underline">¿No tienes cuenta? Regístrate</button>
            </div>
            <p id="login-error" class="text-red-500 text-sm text-center mt-2 hidden"></p>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-screen" class="hidden w-full flex">
        
        <!-- MENÚ LATERAL -->
        <aside id="sidebar" class="w-64 text-white flex flex-col h-full transition-colors duration-300 bg-gray-900 shrink-0">
            <div class="p-6 text-center border-b border-slate-800/80">
                <div class="flex items-center justify-center gap-2.5">
                    <i data-lucide="graduation-cap" class="w-6 h-6 text-indigo-400"></i>
                    <h2 class="text-xl font-bold tracking-tight">ITP Conecta</h2>
                </div>
                <p id="user-role-badge" class="text-[11px] font-semibold tracking-wider mt-3 px-3 py-1 rounded-md inline-block">ADMIN</p>
            </div>
            
            <!-- MENÚ ADMIN -->
            <nav id="nav-admin" class="flex-1 p-4 space-y-1.5 hidden overflow-y-auto">
                <button onclick="cargarVista('admin_dashboard')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80 hover:text-white transition">
                    <i data-lucide="home" class="w-4 h-4 shrink-0 text-slate-400"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="cargarVista('admin_cursos')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80 hover:text-white transition">
                    <i data-lucide="folder" class="w-4 h-4 shrink-0 text-slate-400"></i>
                    <span>Gestión de Cursos</span>
                </button>
                <button onclick="cargarVista('admin_estudiantes')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80 hover:text-white transition">
                    <i data-lucide="users" class="w-4 h-4 shrink-0 text-slate-400"></i>
                    <span>Gestión de Estudiantes</span>
                </button>
                <button onclick="cargarVista('admin_inscripciones')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80 hover:text-white transition">
                    <i data-lucide="file-pen" class="w-4 h-4 shrink-0 text-slate-400"></i>
                    <span>Gestión de Inscripciones</span>
                </button>
                <button onclick="cargarVista('admin_calificaciones')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80 hover:text-white transition">
                    <i data-lucide="file-check" class="w-4 h-4 shrink-0 text-slate-400"></i>
                    <span>Gestión de Calificaciones</span>
                </button>
                <button onclick="cargarVista('admin_reportes')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80 hover:text-white transition">
                    <i data-lucide="activity" class="w-4 h-4 shrink-0 text-slate-400"></i>
                    <span>Reportes (Vistas)</span>
                </button>
            </nav>

            <!-- MENÚ ESTUDIANTE -->
            <nav id="nav-estudiante" class="flex-1 p-4 space-y-1.5 hidden">
                <button onclick="cargarVista('estudiante_dashboard')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-emerald-100 hover:bg-emerald-800/80 hover:text-white transition">
                    <i data-lucide="home" class="w-4 h-4 shrink-0"></i>
                    <span>Inicio</span>
                </button>
                <button onclick="cargarVista('estudiante_calificaciones')" class="w-full flex items-center gap-3 text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-emerald-100 hover:bg-emerald-800/80 hover:text-white transition">
                    <i data-lucide="file-check" class="w-4 h-4 shrink-0"></i>
                    <span>Mis Calificaciones</span>
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800/80">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-red-950/40 border border-red-500/40 text-red-400 py-2.5 rounded-xl text-sm font-medium hover:bg-red-600 hover:text-white hover:border-red-600 transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <!-- CONTENIDO -->
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight" id="page-title">Cargando...</h1>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-200/80 text-slate-500 flex items-center justify-center">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <div class="text-sm">
                        <span class="text-slate-500">Usuario:</span>
                        <span id="user-name" class="font-semibold text-slate-800 ml-1">Cargando...</span>
                    </div>
                </div>
            </header>
            <div id="content-area" class="space-y-6"></div>
        </main>
    </div>

    <!-- MODAL REGISTRO -->
    <div id="registro-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-96 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Registrar Usuario</h2>
            <input type="text" id="reg-nombre" placeholder="Nombre completo" class="w-full mb-3 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="email" id="reg-email" placeholder="Correo" class="w-full mb-3 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" id="reg-password" placeholder="Contraseña" class="w-full mb-3 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="date" id="reg-fecha" class="w-full mb-5 px-4 py-2.5 border border-slate-200 rounded-xl text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleModal('registro-modal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancelar</button>
                <button onclick="registrar()" class="px-5 py-2 text-sm font-semibold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition">Registrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR ESTUDIANTE -->
    <div id="editar-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-96 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Editar Estudiante</h2>
            <input type="hidden" id="edit-id">
            <label class="text-xs font-semibold text-slate-500 uppercase">Nombre</label>
            <input type="text" id="edit-nombre" class="w-full mt-1 mb-3 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <label class="text-xs font-semibold text-slate-500 uppercase">Correo Electrónico</label>
            <input type="email" id="edit-email" class="w-full mt-1 mb-5 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleModal('editar-modal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancelar</button>
                <button onclick="guardarEdicionEstudiante()" class="px-5 py-2 text-sm font-semibold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA JS -->
    <script>
        const API_URL = "http://127.0.0.1:8000";
        let token = localStorage.getItem("token");
        let userRole = localStorage.getItem("rol");
        let userEmail = localStorage.getItem("email");
        let userNombre = localStorage.getItem("nombre");

        window.onload = () => { 
            lucide.createIcons();
            if (token) mostrarApp(); 
        };

        async function login() {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const formData = new URLSearchParams();
            formData.append("username", email);
            formData.append("password", password);

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: "POST", body: formData, headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });
                if (!res.ok) throw new Error("Credenciales incorrectas");
                const data = await res.json();
                token = data.access_token;
                const payload = JSON.parse(atob(token.split('.')[1]));
                
                localStorage.setItem("token", token);
                localStorage.setItem("rol", payload.rol);
                localStorage.setItem("email", email);
                
                const resPerfil = await fetch(`${API_URL}/estudiante/perfil`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (resPerfil.ok) {
                    const perfil = await resPerfil.json();
                    localStorage.setItem("nombre", perfil.nombre);
                    userNombre = perfil.nombre;
                } else {
                    localStorage.setItem("nombre", email.split('@')[0]);
                    userNombre = email.split('@')[0];
                }
                
                userRole = payload.rol;
                userEmail = email;
                
                mostrarApp();
            } catch (error) {
                document.getElementById("login-error").textContent = error.message;
                document.getElementById("login-error").classList.remove("hidden");
            }
        }

        function logout() { 
            localStorage.clear(); 
            location.reload(); 
        }

        function mostrarApp() {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("app-screen").classList.remove("hidden");
            
            document.getElementById("user-name").textContent = userEmail || "Usuario";

            const badge = document.getElementById("user-role-badge");
            if (userRole === "ADMIN") {
                badge.textContent = "ADMINISTRADOR";
                badge.classList.add("bg-indigo-500");
                document.getElementById("sidebar").classList.replace("bg-gray-900", "bg-slate-900");
                document.getElementById("nav-admin").classList.remove("hidden");
                cargarVista("admin_dashboard");
            } else {
                badge.textContent = "ESTUDIANTE";
                badge.classList.add("bg-emerald-500");
                document.getElementById("sidebar").classList.replace("bg-gray-900", "bg-emerald-900");
                document.getElementById("nav-estudiante").classList.remove("hidden");
                cargarVista("estudiante_dashboard");
            }
            lucide.createIcons();
        }

        async function registrar() {
            const body = {
                nombre: document.getElementById("reg-nombre").value,
                email: document.getElementById("reg-email").value,
                password: document.getElementById("reg-password").value,
                fecha_nac: document.getElementById("reg-fecha").value || null
            };
            const res = await fetch(`${API_URL}/registro`, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
            });
            if (res.ok) { alert("Usuario registrado con éxito."); toggleModal('registro-modal'); }
            else { const err = await res.json(); alert("Error: " + err.detail); }
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle("hidden"); }

        async function apiFetch(endpoint, options = {}) {
            options.headers = { ...options.headers, "Authorization": `Bearer ${token}` };
            const res = await fetch(`${API_URL}${endpoint}`, options);
            if (res.status === 401) logout();
            return res;
        }

        // --- VISTAS DINÁMICAS ---
        function cargarVista(vista) {
            const area = document.getElementById("content-area");
            const title = document.getElementById("page-title");
            area.innerHTML = "<p class='text-slate-400 text-sm'>Cargando...</p>";

            if (vista === "admin_dashboard") {
                title.textContent = "Dashboard Administrativo";
                area.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                            <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Bienvenido al Sistema</h3>
                            <p class="text-2xl font-bold text-indigo-600 mt-2">${userNombre || 'Administrador'}</p>
                            <p class="text-sm text-slate-500 mt-2">Usa el menú lateral para gestionar todos los registros escolares.</p>
                        </div>
                    </div>
                `;
            } 
            else if (vista === "admin_cursos") {
                title.textContent = "Gestión de Cursos";
                area.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-6">
                        <h3 class="font-bold text-base text-slate-800 mb-4">Crear Nuevo Curso</h3>
                        <div class="flex space-x-4">
                            <input type="text" id="curso-nombre" placeholder="Nombre del curso" class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <input type="number" id="curso-creditos" placeholder="Créditos" class="w-36 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <button onclick="crearCurso()" class="bg-emerald-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-emerald-700 transition">Guardar Curso</button>
                        </div>
                    </div>
                    <div id="tabla-cursos" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden"></div>
                `;
                cargarTabla("admin/cursos", "tabla-cursos", "cursos");
            }
            else if (vista === "admin_estudiantes") {
                title.textContent = "Directorio de Estudiantes";
                area.innerHTML = `<div id="tabla-estudiantes" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden"></div>`;
                cargarTabla("admin/estudiantes", "tabla-estudiantes", "estudiantes");
            }
            else if (vista === "admin_inscripciones") {
                title.textContent = "Gestión de Inscripciones";
                area.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-6">
                        <h3 class="font-bold text-base text-slate-800 mb-4">Inscribir Estudiante</h3>
                        <div class="flex space-x-4">
                            <select id="ins-est" class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="">Cargando estudiantes...</option>
                            </select>
                            <select id="ins-curso" class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="">Cargando cursos...</option>
                            </select>
                            <button onclick="crearInscripcion()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition">Inscribir</button>
                        </div>
                    </div>
                    <div id="tabla-inscripciones" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden"></div>
                `;
                cargarTabla("admin/inscripciones", "tabla-inscripciones", "inscripciones");
                cargarOpcionesInscripcion();
            }
            else if (vista === "admin_calificaciones") {
                title.textContent = "Gestión de Calificaciones";
                area.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-6">
                        <h3 class="font-bold text-base text-slate-800 mb-4">Registrar Calificación</h3>
                        <div class="flex space-x-4">
                            <select id="cal-ins" class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="">Cargando inscripciones...</option>
                            </select>
                            <input type="number" id="cal-parcial" placeholder="Parcial (1,2,3)" class="w-40 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <input type="number" step="0.1" id="cal-nota" placeholder="Nota (0-10)" class="w-40 px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <button onclick="crearCalificacion()" class="bg-purple-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-purple-700 transition">Guardar Nota</button>
                        </div>
                    </div>
                    <div id="tabla-calificaciones" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden"></div>
                `;
                cargarTabla("admin/calificaciones", "tabla-calificaciones", "calificaciones");
                cargarOpcionesCalificacion();
            }
            else if (vista === "admin_reportes") {
                title.textContent = "Reportes Globales (Vistas SQL)";
                area.innerHTML = `
                    <div class="flex space-x-4 mb-6">
                        <button onclick="cargarReporte('promedios', 'tabla-reporte')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition">Promedios Generales</button>
                        <button onclick="cargarReporte('reprobados', 'tabla-reporte')" class="bg-red-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-red-700 transition">Alumnos Reprobados</button>
                    </div>
                    <div id="tabla-reporte" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                        <p class="p-6 text-slate-400 text-sm text-center">Selecciona un reporte.</p>
                    </div>
                `;
            }
            else if (vista === "estudiante_dashboard") {
                title.textContent = "Inicio";
                area.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 border-l-4 border-l-emerald-500">
                        <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Bienvenido Estudiante</h3>
                        <p class="text-2xl font-bold text-slate-800 mt-2">${userNombre || 'Usuario'}</p>
                    </div>
                `;
            }
            else if (vista === "estudiante_calificaciones") {
                title.textContent = "Mis Calificaciones";
                area.innerHTML = `<div id="tabla-estudiante" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden"></div>`;
                cargarTabla("estudiante/mis_calificaciones", "tabla-estudiante", null, false);
            }
            lucide.createIcons();
        }

        // --- CARGAR OPCIONES EN LOS SELECTS ---
        async function cargarOpcionesInscripcion() {
            const selectEst = document.getElementById("ins-est");
            const selectCur = document.getElementById("ins-curso");

            const resEst = await apiFetch("/admin/estudiantes");
            if (resEst.ok) {
                const estudiantes = await resEst.json();
                selectEst.innerHTML = '<option value="">Seleccione un estudiante...</option>';
                estudiantes.forEach(e => {
                    selectEst.innerHTML += `<option value="${e.id}">${e.nombre} (${e.email})</option>`;
                });
            }

            const resCur = await apiFetch("/admin/cursos");
            if (resCur.ok) {
                const cursos = await resCur.json();
                selectCur.innerHTML = '<option value="">Seleccione un curso...</option>';
                cursos.forEach(c => {
                    selectCur.innerHTML += `<option value="${c.id}">${c.nombre} (${c.creditos} créditos)</option>`;
                });
            }
        }

        async function cargarOpcionesCalificacion() {
            const selectIns = document.getElementById("cal-ins");
            const res = await apiFetch("/admin/inscripciones");
            if (res.ok) {
                const inscripciones = await res.json();
                selectIns.innerHTML = '<option value="">Seleccione una inscripción...</option>';
                inscripciones.forEach(i => {
                    selectIns.innerHTML += `<option value="${i.id}">${i.estudiante} - ${i.curso}</option>`;
                });
            }
        }

        // --- ACCIONES ---
        async function crearCurso() {
            const nombre = document.getElementById("curso-nombre").value;
            const creditos = document.getElementById("curso-creditos").value;
            const res = await apiFetch("/admin/cursos", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre, creditos: parseInt(creditos) })
            });
            if (res.ok) { alert("Curso creado!"); cargarVista('admin_cursos'); } else { alert("Error al crear curso"); }
        }

        async function crearInscripcion() {
            const est = document.getElementById("ins-est").value;
            const cur = document.getElementById("ins-curso").value;
            
            if(!est || !cur) { alert("Por favor selecciona un estudiante y un curso"); return; }

            const res = await apiFetch("/admin/inscripciones", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ estudiante_id: parseInt(est), curso_id: parseInt(cur) })
            });
            const data = await res.json();
            if (res.ok) { alert("✅ " + data.mensaje); cargarVista('admin_inscripciones'); } 
            else { alert("❌ Error: " + data.detail); }
        }

        async function crearCalificacion() {
            const ins = document.getElementById("cal-ins").value;
            const par = document.getElementById("cal-parcial").value;
            const nota = document.getElementById("cal-nota").value;
            
            if (!ins || !par || !nota) { alert("⚠️ Llena todos los campos"); return; }
            
            const res = await apiFetch("/admin/calificaciones", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ inscripcion_id: parseInt(ins), parcial: parseInt(par), calificacion: parseFloat(nota) })
            });
            const data = await res.json();
            if (res.ok) { alert("✅ Calificación guardada"); cargarVista('admin_calificaciones'); } 
            else { alert("❌ Error: " + data.detail); }
        }

        async function eliminarRegistro(ruta, id, vistaActual) {
            if (!confirm("¿Estás seguro de eliminar este registro? Esta acción no se puede deshacer.")) return;
            const res = await apiFetch(`${ruta}/${id}`, { method: "DELETE" });
            if (res.ok) { alert("Registro eliminado"); cargarVista(vistaActual); }
            else { alert("Error al eliminar"); }
        }

        // --- CAMBIAR CONTRASEÑA ---
        async function cambiarPassword(id, nombre) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let randomPass = "";
            for (let i = 0; i < 8; i++) randomPass += chars.charAt(Math.floor(Math.random() * chars.length));

            const nuevaPass = prompt(`Ingresa la nueva contraseña para ${nombre}.\n\n(Puedes usar esta generada automáticamente):`, randomPass);
            
            if (nuevaPass === null) return;
            if (nuevaPass.trim() === "") { alert("La contraseña no puede estar vacía."); return; }

            const res = await apiFetch(`/admin/estudiantes/${id}/password`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nueva_password: nuevaPass })
            });

            if (res.ok) {
                alert(`✅ Contraseña actualizada.\n\nLa nueva clave de ${nombre} es: ${nuevaPass}\n\nAsegúrate de copiarla y enviársela.`);
            } else {
                alert("❌ Error al cambiar la contraseña");
            }
        }

        // --- EDITAR ESTUDIANTE ---
        function abrirModalEditar(id, nombre, email) {
            document.getElementById("edit-id").value = id;
            document.getElementById("edit-nombre").value = nombre;
            document.getElementById("edit-email").value = email;
            toggleModal('editar-modal');
        }

        async function guardarEdicionEstudiante() {
            const id = document.getElementById("edit-id").value;
            const nombre = document.getElementById("edit-nombre").value;
            const email = document.getElementById("edit-email").value;

            if (!nombre || !email) { alert("El nombre y correo no pueden estar vacíos."); return; }

            const res = await apiFetch(`/admin/estudiantes/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre, email })
            });

            const data = await res.json();
            if (res.ok) {
                alert("✅ Datos actualizados correctamente.");
                toggleModal('editar-modal');
                cargarVista('admin_estudiantes');
            } else {
                alert("❌ Error: " + data.detail);
            }
        }

        // --- TABLAS GENÉRICAS ---
        async function cargarTabla(endpoint, contenedorId, tipo) {
            const res = await apiFetch(`/${endpoint}`);
            const data = await res.json();
            const contenedor = document.getElementById(contenedorId);
            
            if (data.length === 0) {
                contenedor.innerHTML = "<p class='p-6 text-slate-400 text-sm text-center'>No hay registros en esta tabla.</p>";
                return;
            }

            const headers = Object.keys(data[0]);
            let html = `<div class="overflow-x-auto table-scroll"><table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-slate-500 font-semibold text-xs uppercase tracking-wider sticky top-0 z-10">
                    <tr>`;
            headers.forEach(h => html += `<th class="py-4 px-5 border-b border-slate-200/80">${h.toUpperCase().replace('_', ' ')}</th>`);
            if (tipo !== null) html += `<th class="py-4 px-5 border-b border-slate-200/80 text-right">ACCIONES</th>`;
            html += `</tr></thead><tbody class="divide-y divide-slate-100 text-slate-600 text-sm">`;
            
            data.forEach(row => {
                html += `<tr class="hover:bg-slate-50/80 transition-colors">`;
                headers.forEach(h => {
                    let val = row[h] !== null ? row[h] : '-';
                    if (h.includes('fecha') || h === 'creado_en') {
                        const fechaTexto = new Date(val).toLocaleDateString('es-ES', { year: 'numeric', month: 'short', day: 'numeric' });
                        val = h.includes('fecha')
                            ? `<span class="inline-flex items-center gap-1.5">${fechaTexto} <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i></span>`
                            : fechaTexto;
                    } else if (h === 'rol') {
                        const badgeClase = String(val).toUpperCase() === 'ADMIN'
                            ? 'bg-purple-100 text-purple-700'
                            : 'bg-sky-100 text-sky-700';
                        val = `<span class="px-3 py-1 rounded-full text-xs font-semibold ${badgeClase}">${val}</span>`;
                    } else if (h === 'nombre' || h === 'estudiante') {
                        val = `<span class="font-medium text-slate-800">${val}</span>`;
                    }
                    html += `<td class="py-4 px-5 whitespace-nowrap">${val}</td>`;
                });
                
                if (tipo !== null) {
                    html += `<td class="py-4 px-5 text-right whitespace-nowrap space-x-2">`;
                    
                    if (tipo === "estudiantes") {
                        // 👇 BOTÓN EDITAR AGREGADO AQUÍ 👇
                        html += `<button onclick="abrirModalEditar(${row.id}, '${row.nombre}', '${row.email}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-indigo-200 bg-indigo-50/70 text-indigo-600 hover:bg-indigo-100 text-xs font-semibold transition" title="Editar Nombre y Correo">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                            <span>Editar</span>
                        </button>`;
                        // BOTÓN CLAVE
                        html += `<button onclick="cambiarPassword(${row.id}, '${row.nombre}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-amber-200 bg-amber-50/70 text-amber-700 hover:bg-amber-100 text-xs font-semibold transition" title="Cambiar Contraseña">
                            <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
                            <span>Clave</span>
                        </button>`;
                    }
                    
                    // BOTÓN ELIMINAR
                    html += `<button onclick="eliminarRegistro('admin/${tipo}', ${row.id}, 'admin_${tipo}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-red-200 bg-red-50/70 text-red-600 hover:bg-red-100 text-xs font-semibold transition">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        <span>Eliminar</span>
                    </button>
                    </td>`;
                }
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            contenedor.innerHTML = html;
            lucide.createIcons();
        }

        async function cargarReporte(tipo, idContenedor) {
            const res = await apiFetch(`/reportes/${tipo}`);
            const data = await res.json();
            const contenedor = document.getElementById(idContenedor);
            if (data.length === 0) { contenedor.innerHTML = "<p class='p-6 text-slate-400 text-sm text-center'>No hay datos.</p>"; return; }
            
            const headers = Object.keys(data[0]);
            let html = `<div class="overflow-x-auto table-scroll"><table class="w-full text-left border-collapse"><thead class="bg-indigo-50/80 text-indigo-800 font-semibold text-xs uppercase tracking-wider"><tr>`;
            headers.forEach(h => html += `<th class="py-4 px-5 border-b border-indigo-100">${h.toUpperCase().replace('_', ' ')}</th>`);
            html += `</tr></thead><tbody class="divide-y divide-slate-100 text-slate-600 text-sm">`;
            data.forEach(row => {
                html += `<tr class="hover:bg-slate-50/80 transition-colors">`;
                headers.forEach(h => html += `<td class="py-4 px-5">${row[h] !== null ? row[h] : '-'}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            contenedor.innerHTML = html;
        }
    </script>
